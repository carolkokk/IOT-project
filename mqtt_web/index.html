<!doctype html>
<html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<head><meta charset="utf-8"><title>Dashboard</title></head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
  <h1>HUMIBOX</h1>
  <a href="/logout"
     style="
        padding:8px 14px;
        background:#e74c3c;
        color:white;
        text-decoration:none;
        border-radius:4px;
        font-size:14px;
     ">
     Logout
  </a>
</div>
  <a href="/add">Set humidity level</a>

  <input id="sp">
  <button onclick="sendSP()">Set Humidity</button>
  <p>Current Humidity Setpoint: <span id="sp-display">--</span></p>
  <p id="alert-text" style="color: red; font-weight: bold;"></p>
  <canvas id="thChart" height="120"></canvas>


<script>
async function sendSP(){
  const v = document.getElementById('sp').value;
  await fetch('/setpoint', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ setpoint: v })
  });
  document.getElementById('sp').value = "";
  alert('sent');
}


const ctx = document.getElementById('thChart');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Humidity', data: [] },
        { label: 'Temperature', data: [] }
      ]
    },
    options: {
      animation: false,
      responsive: true
    }
});

async function updateChart() {
    const res = await fetch('/messages');
    const data = await res.json();


    const last = data.slice(-60);
    console.log(last);

    chart.data.labels = last.map(d => new Date(d.t).toLocaleString());
    chart.data.datasets[1].data = last.map(d => d.temp);
    chart.data.datasets[0].data = last.map(d => d.hum);
    chart.update();
}

updateChart();
setInterval(updateChart, 5000);

const evtSource = new EventSource("/events");

async function updateSetpoint() {
  const res = await fetch('/getsetpoint');
  const data = await res.json();
  if (data.setpoint !== null) {
    document.getElementById("sp-display").innerText = data.setpoint;
  }
}

updateSetpoint();
setInterval(updateSetpoint, 5000);

evtSource.onmessage = function (e) {
  const data = JSON.parse(e.data);
  const el = document.getElementById("alert-text");
  el.innerText = data.alert === 1 ? data.text : "";
};
</script>

</body>
</html>
