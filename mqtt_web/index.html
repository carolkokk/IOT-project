<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUMIBOX Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.logout-btn {
    padding: 8px 14px;
    background-color: #dc2626;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    margin-bottom: 25px;
}

.input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

input {
    padding: 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    flex: 1;
}

input:focus {
    border-color: #2563eb;
    outline: none;
}

.primary-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
}

.primary-btn:hover {
    background: #1e40af;
}

.alert-text {
    color: #dc2626;
    font-weight: 600;
}

/* Presets */

.preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.preset-item {
    background: #f9fafb;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: 0.2s;
}

.preset-item:hover {
    background: #e5e7eb;
}

.preset-item.active {
    border-color: #2563eb;
    background: rgba(37, 99, 235, 0.1);
}

.preset-item img {
    margin-bottom: 6px;
}

/* Summary */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 10px;
}

.summary-item {
    background: #f9fafb;
    padding: 15px;
    border-radius: 6px;
}

.placeholder {
    color: #9ca3af;
}

.warning-text {
    color: #dc2626;
    font-weight: 600;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>HUMIBOX Dashboard</h1>
    <a href="/logout" class="logout-btn">Logout</a>
</div>

<!-- Control -->
<div class="card">
    <h3>Humidity Control</h3>

    <div class="input-row">
        <input id="sp" placeholder="Enter humidity (30-90)">
        <button class="primary-btn" onclick="sendSP()">Set</button>
    </div>

    <p>Current Setpoint: <strong id="sp-display">--</strong></p>
    <p id="alert-text" class="alert-text"></p>

    <h4>Presets</h4>

    <div class="preset-grid">

        <div class="preset-item" data-value="65" onclick="applyPreset(65)">
            <img src="icons/cigar.png" width="50">
            <div>Cigar</div>
            <small>65%</small>
        </div>

        <div class="preset-item" data-value="50" onclick="applyPreset(50)">
            <img src="icons/violin.png" width="50">
            <div>Violin</div>
            <small>50%</small>
        </div>

        <div class="preset-item" data-value="45" onclick="applyPreset(45)">
            <img src="icons/guitar-instrument.png" width="50">
            <div>Guitar</div>
            <small>45%</small>
        </div>

        <div class="preset-item" data-value="48" onclick="applyPreset(48)">
            <img src="icons/electric-guitar.png" width="50">
            <div>Electric Guitar</div>
            <small>48%</small>
        </div>

        <div class="preset-item" data-value="55" onclick="applyPreset(55)">
            <img src="icons/harmonica.png" width="50">
            <div>Harmonica</div>
            <small>55%</small>
        </div>

    </div>
</div>

<!-- Chart -->
<div class="card">
    <h3>Temperature & Humidity Trend</h3>
    <canvas id="thChart" height="100"></canvas>
</div>

<!-- Summary -->
<div class="card">
    <h3>System Summary (Last 30 Records)</h3>
    <div id="summary-panel" class="summary-grid"></div>
</div>

</div>

<script>

/* Preset Highlight */

function highlightPreset(value) {
    const items = document.querySelectorAll(".preset-item");
    items.forEach(item => {
        item.classList.remove("active");
        if (parseInt(item.dataset.value) === parseInt(value)) {
            item.classList.add("active");
        }
    });
}

function applyPreset(value) {
    document.getElementById("sp").value = value;
    sendSP();
    highlightPreset(value);
}

/* Send Setpoint */

async function sendSP() {

    const v = document.getElementById('sp').value;

    if (v === "" || isNaN(v) || v < 30 || v > 90) {
        alert("Humidity must be between 30 and 90");
        return;
    }

    await fetch('/setpoint', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ setpoint: v })
    });

    highlightPreset(v);
}

/* Update Setpoint */

async function updateSetpoint() {
    const res = await fetch('/getsetpoint');
    const data = await res.json();
    document.getElementById("sp-display").innerText = data.setpoint;
    highlightPreset(data.setpoint);
}

/* Chart with Deadband */

const ctx = document.getElementById('thChart');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'Humidity (%)', data: [], borderColor: '#2563eb', tension: 0.3 },
            { label: 'Temperature (°C)', data: [], borderColor: '#f59e0b', tension: 0.3 },
            { label: 'Upper Bound', data: [], borderColor: 'rgba(34,197,94,0.6)', borderDash: [6,6], pointRadius: 0 },
            { label: 'Lower Bound', data: [], borderColor: 'rgba(34,197,94,0.6)', backgroundColor: 'rgba(34,197,94,0.1)', fill: '-1', pointRadius: 0 }
        ]
    },
    options: { animation: false }
});

async function updateChart() {

    const res = await fetch('/messages');
    const data = await res.json();
    const last = data.slice(-30);

    const labels = last.map(d => new Date(d.t).toLocaleTimeString());
    const humData = last.map(d => d.hum);
    const tempData = last.map(d => d.temp);

    chart.data.labels = labels;
    chart.data.datasets[0].data = humData;
    chart.data.datasets[1].data = tempData;

    const sp = parseFloat(document.getElementById("sp-display").innerText);

    if (!isNaN(sp)) {
        chart.data.datasets[2].data = Array(labels.length).fill(sp + 5);
        chart.data.datasets[3].data = Array(labels.length).fill(sp - 5);
    } else {
        chart.data.datasets[2].data = [];
        chart.data.datasets[3].data = [];
    }

    chart.update();
}

/* Summary Safe */

async function updateSummary() {

    const panel = document.getElementById("summary-panel");
    const res = await fetch('/messages');
    const data = await res.json();

    let maxTemp = '<span class="placeholder">/</span>';
    let minTemp = '<span class="placeholder">/</span>';
    let maxHum  = '<span class="placeholder">/</span>';
    let minHum  = '<span class="placeholder">/</span>';
    let alarmStatus = '<span class="placeholder">/</span>';

    if (data.length > 0) {

        const last = data.slice(-30);
        const temps = last.map(d => d.temp);
        const hums  = last.map(d => d.hum);
        const alarms = last.map(d => d.alarm);

        maxTemp = Math.max(...temps).toFixed(1) + " °C";
        minTemp = Math.min(...temps).toFixed(1) + " °C";
        maxHum  = Math.max(...hums).toFixed(1) + " %";
        minHum  = Math.min(...hums).toFixed(1) + " %";

        const hasAlarm = alarms.some(a => a == 1);
        alarmStatus = hasAlarm
            ? '<span class="warning-text">Warning</span>'
            : "Normal";
    }

    panel.innerHTML = `
        <div class="summary-item"><strong>Max Temperature</strong>${maxTemp}</div>
        <div class="summary-item"><strong>Min Temperature</strong>${minTemp}</div>
        <div class="summary-item"><strong>Max Humidity</strong>${maxHum}</div>
        <div class="summary-item"><strong>Min Humidity</strong>${minHum}</div>
        <div class="summary-item"><strong>Alarm Status</strong>${alarmStatus}</div>
    `;
}

/* SSE Alert */

const evtSource = new EventSource("/events");

evtSource.onmessage = function (e) {
    const data = JSON.parse(e.data);
    const el = document.getElementById("alert-text");
    el.innerText = data.alert === 1 ? data.text : "";
};

/* Init */

updateChart();
updateSummary();
updateSetpoint();

setInterval(updateChart, 5000);
setInterval(updateSummary, 5000);
setInterval(updateSetpoint, 5000);

</script>

</body>
</html>
