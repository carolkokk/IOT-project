<!doctype html>
<html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<head><meta charset="utf-8"><title>Dashboard</title></head>
<body>
  <h1>HUMIBOX</h1>
  <a href="/add">Set humidity level</a>

  <input id="sp">
  <button onclick="sendSP()">Set Humidity</button>
  <canvas id="thChart" height="120"></canvas>

</body>
</html>


<script>
async function sendSP(){
  const v = document.getElementById('sp').value;
  await fetch('/setpoint', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ setpoint: v })
  });
  alert('sent');
}


const ctx = document.getElementById('thChart');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Humidity', data: [] },
        { label: 'Temperature', data: [] }
      ]
    },
    options: {
      animation: false,
      responsive: true
    }
});

async function updateChart() {
    const res = await fetch('/messages');
    const data = await res.json();


    const last = data.slice(-60);
    console.log(last);

    chart.data.labels = last.map(d => new Date(d.t).toLocaleString());
    chart.data.datasets[1].data = last.map(d => d.temp);
    chart.data.datasets[0].data = last.map(d => d.hum);
    chart.update();
}

updateChart();
setInterval(updateChart, 5000);
</script>
